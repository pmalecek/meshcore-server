services:
  meshcore-server:
    build: .
    image: meshcore-server:latest
    container_name: meshcore-server
    restart: unless-stopped
    # Konfigurace buď souborem…
    # Adresář data musí patřit UID 1000 (uživatel v kontejneru):
    #   mkdir -p data && sudo chown 1000:1000 data
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    # …nebo jen proměnnými prostředí (přepisují hodnoty ze souboru):
    environment:
      TZ: Europe/Prague
      # MCS_COMPANION__TCP__HOST: 192.168.1.160
      # MCS_COMPANION__TCP__PORT: 5000
    ports:
      - "8080:8080"   # API
